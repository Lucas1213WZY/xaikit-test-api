# Render Blueprint — connect this repo at https://dashboard.render.com/blueprints
# and Render reads this file to create the service. Builds server/Dockerfile
# (the existing image also used for the self-hosted deploy in deploy/), so both
# paths stay in sync.
services:
  - type: web
    name: xaikit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard # free tier's 512MB RAM OOMs on real MLP/xgboost training
    # (confirmed: one CoAX design with 3 ml_proxy baselines plus LIME/SHAP
    # generation for adult-income exceeded it) and sleeps after 15min idle.
    disk:
      name: xaikit-server-runs
      mountPath: /data
      sizeGB: 5
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: XAIKIT_API_TOKEN
        generateValue: true # rotate any time from the Render dashboard; put the same value in the UI's config
      - key: XAIKIT_ALLOWED_ORIGINS
        sync: false # set to your UI's origin, e.g. https://you.github.io -- comma-separate for more than one
      - key: MPLBACKEND
        value: Agg
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: XAIKIT_SERVER_RUNS_DIR
        value: /data/server_runs
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
