<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — XAIKit</title>
<style>
  :root {
    --bg: #fff;
    --fg: #212529;
    --muted: #6c757d;
    --accent: #0d6efd;
    --border: #dee2e6;
    --code-bg: #f8f9fa;
    --sidebar-bg: #f8f9fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #6ea8fe;
      --border: #2c3034;
      --code-bg: #1e2126;
      --sidebar-bg: #1a1d21;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: var(--fg);
    background: var(--bg);
  }
  .layout { display: flex; min-height: 100vh; align-items: flex-start; }
  nav.sidebar {
    width: 16rem;
    flex: 0 0 16rem;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
  }
  nav.sidebar .brand {
    font-weight: 700;
    font-size: 1.15rem;
    display: block;
    margin-bottom: 0.25rem;
    color: var(--fg);
    text-decoration: none;
  }
  nav.sidebar .tagline {
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 1.25rem;
  }
  nav.sidebar a {
    display: block;
    padding: 0.3rem 0;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
  }
  nav.sidebar a:hover { text-decoration: underline; }
  main {
    flex: 1 1 auto;
    min-width: 0;
    padding: 2.5rem 3rem;
    max-width: 56rem;
  }
  h1, h2, h3, h4 { line-height: 1.25; margin-top: 2rem; }
  h1 { margin-top: 0; font-size: 2rem; }
  h2 {
    font-size: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.3rem;
  }
  h3 { font-size: 1.2rem; }
  a { color: var(--accent); }
  code {
    background: var(--code-bg);
    padding: 0.15em 0.35em;
    border-radius: 3px;
    font-size: 0.88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.9rem 1rem;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; font-size: 0.85rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
  th { background: var(--code-bg); }
  blockquote {
    border-left: 3px solid var(--border);
    margin-left: 0;
    padding-left: 1rem;
    color: var(--muted);
  }
  .todo {
    background: var(--code-bg);
    border-left: 3px solid #ffc107;
    padding: 0.75rem 1rem;
    margin: 1rem 0;
    font-size: 0.9rem;
  }
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    nav.sidebar {
      width: 100%;
      flex: none;
      position: static;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    main { padding: 1.5rem 1.25rem; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <a class="brand" href="index.html">XAIKit</a>
    <div class="tagline">XAI Interpretation Simulator Toolkit</div>
{{NAV}}
  </nav>
  <main>
{{CONTENT}}
  </main>
</div>
</body>
</html>
